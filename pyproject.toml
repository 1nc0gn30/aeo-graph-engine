[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-graph-engine"
version = "1.0.0"
description = "Answer Engine Optimization (AEO/GEO) Engine: Standalone generator and validator for Schema.org linked data, llms.txt, ai.txt, and AI crawler directives."
readme = "README.md"
authors = [
    { name = "NullAI / 757tech Team", email = "architect@nullai.tech" }
]
license = { text = "MIT" }
keywords = [
    "aeo",
    "geo",
    "answer-engine-optimization",
    "generative-engine-optimization",
    "llms-txt",
    "schema-org",
    "json-ld",
    "ai-search",
    "perplexity",
    "chatgpt-search",
    "claudebot",
    "knowledge-graph",
    "seo"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
aeo = "aeo_graph_engine.cli:main"
aeo-engine = "aeo_graph_engine.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/aeo-graph-engine"
Documentation = "https://github.com/1nc0gn30/aeo-graph-engine#readme"
Repository = "https://github.com/1nc0gn30/aeo-graph-engine.git"
Issues = "https://github.com/1nc0gn30/aeo-graph-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
