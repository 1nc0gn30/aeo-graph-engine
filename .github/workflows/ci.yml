name: CI & Multi-Platform Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Verify Platform Compatibility Info
        run: |
          python -m aeo_graph_engine.cli --platform

      - name: Run Built-in Self Test
        run: |
          python -m aeo_graph_engine.cli --test

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --color=yes

      - name: Test CLI Commands End-to-End
        shell: bash
        run: |
          # 1. Generate complete bundle
          python -m aeo_graph_engine.cli --generate-all --output-dir dist_ci --site-name "CI Test" --domain "ci.test"
          
          # 2. Validate bundle
          python -m aeo_graph_engine.cli --validate dist_ci
          
          # 3. Test prompt synthesis
          python -m aeo_graph_engine.cli prompt "A Solana DeFi lending app called SolarYield on solaryield.fi" --output-dir dist_prompt
          
          # 4. Test framework code export
          python -m aeo_graph_engine.cli framework nextjs_app --output-dir dist_next
          python -m aeo_graph_engine.cli framework astro --output-dir dist_astro
          
          # 5. Test MCP client config generators
          python -m aeo_graph_engine.cli mcp --config claude_desktop
          python -m aeo_graph_engine.cli mcp --config cursor
          python -m aeo_graph_engine.cli mcp --config cline
          python -m aeo_graph_engine.cli mcp --config zed

      - name: Test Distribution Package Build (.whl & .tar.gz)
        run: |
          python -m build
          python -m pip install dist/*.whl
          aeo --platform
          aeo --test
